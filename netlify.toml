[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/proxy/wx/api/data/:product"
  to = "https://aviationweather.gov/api/data/:product"
  status = 200

[[redirects]]
  from = "/proxy/adsblol/v2/point/:lat/:lon/:r"
  to = "https://api.adsb.lol/v2/point/:lat/:lon/:r"
  status = 200

[[redirects]]
  from = "/proxy/adsbfi/api/v3/lat/:lat/lon/:lon/dist/:r"
  to = "https://opendata.adsb.fi/api/v3/lat/:lat/lon/:lon/dist/:r"
  status = 200

[[redirects]]
  from = "/guide"
  to = "/index.html"
  status = 200
