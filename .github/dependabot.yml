version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # React 19 and lucide-react 1.x were migrated by hand (2026-10); react and
    # react-dom must bump together.
    groups:
      dev-dependencies:
        dependency-type: development
      react:
        patterns: ["react", "react-dom"]
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
