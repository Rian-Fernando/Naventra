name: IndexNow

# Ping IndexNow whenever a production deploy succeeds, so Bing-backed engines
# (ChatGPT Search, Copilot) re-index changed pages instantly. Also runnable by hand.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  submit:
    # Only on a *successful* *Production* deployment — skip Preview and non-success
    # states. Manual runs (workflow_dispatch) always proceed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No install needed — the script uses only built-in fetch, no dependencies.
      - name: Submit sitemap URLs to IndexNow
        run: npm run indexnow
