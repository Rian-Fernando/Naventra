name: Train model

# Weekly retrain: pull the always-on tracker's full dataset (every page, so every
# season seen so far), train the per-airport runway and ETA models with recency
# weighting, evaluate them head-to-head against what is live on the most recent
# three weeks, and commit the refreshed model + report. Only airports where the
# model wins on that recent window are flagged for adoption (scripts/train_model.py).
# The worker picks up the new public/model.json from GitHub within the hour.
#
# GitHub can skip scheduled runs without notice (this one silently stopped after
# 2026-09-07). The worker emails when the model is >10 days old, and with an
# optional GITHUB_DISPATCH_TOKEN it re-runs this workflow itself (worker/README.md).

on:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC (off the top of the hour, when GitHub is busiest)
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Data-pipeline self-tests
        run: python3 scripts/test_train.py
      - name: Train + evaluate
        run: python3 scripts/train_model.py
      - name: Commit refreshed model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/model.json docs/model-report.md
          if git diff --staged --quiet; then
            echo "No change in model or report."
          else
            git commit -m "Weekly model retrain [skip ci]"
            git push
          fi
