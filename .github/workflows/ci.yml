name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Worker syntax
        run: for f in worker/src/*.js; do node --check "$f"; done
      - name: Engine regression suite
        run: node scripts/ci-regression.mjs
      - name: Feedex widget injection tests
        run: node scripts/test-feedex.mjs
      - name: Data-integrity tests (no synthetic data)
        run: node scripts/test-integrity.mjs
      - name: Tracker tests (alerts, departure experts, dataset paging)
        run: node scripts/test-tracker.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Trainer self-tests
        run: pip install -r scripts/requirements.txt && python3 scripts/test_train.py
